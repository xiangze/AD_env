# ============================================================================
# compose.sparsedrivev2.yml  —  既存 docker-compose.yml に重ねる断片 (NAVSIM トラック)
#
#   docker compose -f docker-compose.yml -f compose.sparsedrivev2.yml \
#                  --env-file .env up -d sparsedrivev2
#   (Makefile.sparsedrivev2 の sv2-* ターゲット経由を推奨)
#
# ホスト配置 (environment-and-build.md §2 の共有データレイク):
#   ${HOST_DATA_ROOT}/openscene/        → /workspace/dataset                (OPENSCENE_DATA_ROOT, 既定 ro)
#     ├── maps/                            nuplan-maps-v1.0 (NUPLAN_MAPS_ROOT)
#     ├── navsim_logs/{mini,test,trainval}/
#     ├── sensor_blobs/{mini,test,trainval}/
#     └── navhard_two_stage/ warmup_two_stage/
#   ${HOST_DATA_ROOT}/navsim_exp/       → /workspace/SparseDriveV2/exp      (NAVSIM_EXP_ROOT, rw)
#   ${HOST_CKPT_DIR}/sparsedrivev2/     → /workspace/SparseDriveV2/ckpt     (既定 ro)
#       resnet34.bin, kmeans/*.npy|npz, sparsedrive_navsimv{1,2}.ckpt
#
# 公式スクリプトは ckpt/ と exp/ を「相対パス」で参照するので、両方とも
# リポジトリ直下 (working_dir) にマウントする。ckpts/ (複数形) や /workspace/exp では動かない。
#
# データ/重みのダウンロード時だけ SV2_DATA_MODE=rw / SV2_CKPT_MODE=rw で書き込み可にする
# (make sv2-data / make sv2-weights が自動で指定)。
# ============================================================================
services:
  sparsedrivev2:
    build:
      context: .
      dockerfile: Dockerfile.sparsedrivev2     # context 制限は Dockerfile.sparsedrivev2.dockerignore
      args:
        SPARSEDRIVE_REF: ${SPARSEV2_REF:-696ef77924eb9e0a4b4047d013a50e9854bfa026}
        TORCH_CUDA_ARCH_LIST: ${SPARSEV2_CUDA_ARCH:-8.6}
    image: sparsedrivev2:latest
    container_name: sparsedrivev2
    hostname: sparsedrivev2
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${SPARSEV2_GPUS:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN:-}
      # NAVSIM 環境変数は Dockerfile 側で設定済み (NAVSIM_DEVKIT_ROOT=/workspace/SparseDriveV2 など)
    ipc: host            # DataLoader workers / ray 用の共有メモリ (shm_size 不要)
    ulimits: { memlock: -1, stack: 67108864 }
    volumes:
      - ${HOST_DATA_ROOT:-/mnt/data}/openscene:/workspace/dataset:${SV2_DATA_MODE:-ro}
      - ${HOST_DATA_ROOT:-/mnt/data}/navsim_exp:/workspace/SparseDriveV2/exp:rw
      - ${HOST_CKPT_DIR:-/mnt/ckpts}/sparsedrivev2:/workspace/SparseDriveV2/ckpt:${SV2_CKPT_MODE:-ro}
      # 開発用: AD_env の submodule (./SparseDriveV2) をソースとして使う場合はコメント解除。
      #   イメージ内の CUDA ops は隠れるが、entrypoint が初回起動時に自動ビルドする。
      #   その場合 ckpt/ exp/ のマウントは submodule 内に重なる (ホスト側に空ディレクトリが作られる)。
      # - ./SparseDriveV2:/workspace/SparseDriveV2
    working_dir: /workspace/SparseDriveV2
    command: sleep infinity
